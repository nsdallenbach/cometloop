bundle:
  name: delivery-console

variables:
  files_path:
    description: Volume path for file storage (e.g. /Volumes/catalog/schema/volume_name)
  files_id:
    description: Permission to write to volumes
  postgres_branch:
    description: Full Lakebase Postgres branch resource name. Obtain by running `databricks postgres list-branches {project-name}`, select the desired item from the output array and use its .name value. Requires the project resource name.
  postgres_database:
    description: Full Lakebase Postgres database resource name. Obtain by running `databricks postgres list-databases {branch-name}`, select the desired item from the output array and use its .name value. Requires the branch resource name.
  postgres_project:
    description: Full Lakebase Postgres project resource name. Obtain by running `databricks postgres list-projects`, select the desired item from the output array and use its .name value.
  serving_endpoint_name:
    description: Serving endpoint name

resources:
  schemas:
    engagement_console:
      catalog_name: sandbox
      name: engagement_console
      comment: "Delivery Console app resources (SOW document volume)"

  volumes:
    sow_docs:
      catalog_name: sandbox
      schema_name: ${resources.schemas.engagement_console.name}
      name: sow_docs
      volume_type: MANAGED
      comment: "Uploaded SOW / SOP documents for engagement setup"

    agent_telemetry:
      catalog_name: sandbox
      schema_name: ${resources.schemas.engagement_console.name}
      name: agent_telemetry
      volume_type: MANAGED
      comment: "Agent run telemetry — per-task tool-call logs archived as NDJSON under tool-calls/<engagement>/<ticket>/"

  apps:
    app:
      name: "delivery-console"
      description: "Cometloop - delivery execution console: portfolio, board, roadmap, sources, team, status feed"
      source_code_path: ./
      user_api_scopes:
        - files.files
        - serving.serving-endpoints

      # The resources which this app has access to.
      resources:
        - name: files
          uc_securable:
            securable_full_name: ${resources.volumes.sow_docs.id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: telemetry
          uc_securable:
            securable_full_name: ${resources.volumes.agent_telemetry.id}
            securable_type: VOLUME
            permission: WRITE_VOLUME
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY
        - name: github-app-private-key
          secret:
            scope: delivery-console
            key: github-app-private-key
            permission: READ

targets:
  default:
    default: true
    # The workspace comes from the CLI profile (databricks auth login) or
    # DATABRICKS_HOST; add a workspace.host here to pin one.

    variables:
      files_path: /Volumes/sandbox/engagement_console/sow_docs
      files_id: sandbox.engagement_console.sow_docs
      postgres_branch: projects/engagement-console/branches/production
      postgres_database: projects/engagement-console/branches/production/databases/databricks-postgres
      postgres_project: projects/engagement-console
      serving_endpoint_name: databricks-claude-sonnet-5

