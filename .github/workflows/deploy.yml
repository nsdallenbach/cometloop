name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a new push waits rather than racing the current one.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: databricks/setup-cli@main

      - name: Deploy bundle
        run: databricks bundle deploy
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # Legacy tables are developer-owned, so the app service principal cannot
      # apply their ALTER migrations during boot. Run the idempotent owner-role
      # migrations before starting code that depends on new columns.
      - name: Run database migrations
        run: |
          export PGPASSWORD="$(databricks postgres generate-database-credential projects/engagement-console/branches/production/endpoints/primary -o json | jq -r .token)"
          node scripts/dev-migrate.cjs
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Start app with new source
        run: databricks bundle run app
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
