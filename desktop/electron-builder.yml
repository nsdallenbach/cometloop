# appId stays as first shipped: NSIS derives the install/uninstall registry
# key from it, so a new id would install Cometloop beside the old build
# instead of updating it in place (electron-updater feed identity too).
appId: com.datavail.delivery-console
productName: Cometloop
directories:
  output: release
  buildResources: resources
files:
  - out/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
mac:
  target:
    - dmg
    # electron-updater's macOS feed requires a zip alongside the dmg; built
    # now so the feed is complete the day signing lands.
    - zip
linux:
  target: AppImage
# Code signing intentionally unconfigured in phase 1 — see
# docs/local-client-architecture.md (procurement item; blocks silent
# auto-update on macOS and SmartScreen-clean installs on Windows, not local
# installs). When certs land, wire CSC_LINK / CSC_KEY_PASSWORD into
# .github/workflows/desktop-release.yml — no change needed here.
publish:
  provider: github
  # Releases and the electron-updater feed now come from nsdallenbach/cometloop
  # (switched 2026-09-22). Builds shipped before that date keep polling the old
  # repo and will not see newer versions; testers reinstall once from the new
  # releases page.
  owner: nsdallenbach
  repo: cometloop
  # Publish as a real release, not a draft: electron-updater only sees
  # published releases, and the workflow already gates on an explicit tag push.
  releaseType: release
